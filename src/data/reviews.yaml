- id: pt-marketing-intern-2
  order: 6
  role: Marketing Intern
  org: Pierce Transit
  quote: Whether he was walking me through his suggestions or leaving detailed comments on ways to make a design clearer and more visually engaging, he helped me understand not just what could be improved, but why.
  full: |
    I had the opportunity to work with Peter for a year during my time as a Marketing Intern at Pierce Transit. As I learned to work in InDesign and apply the company’s brand guidelines, I had a lot to learn, and Peter played a significant role in my growth and development as a designer.

    Peter was always welcoming and willing to offer constructive feedback on the designs I created. Whether he was walking me through his suggestions or leaving detailed comments on ways to make a design clearer and more visually engaging, he helped me understand not just what could be improved, but why. My projects spanned a wide range of print, digital, and out-of-home materials. Each project went through a thorough review process, with collaborative feedback and multiple rounds of proofs to ensure every design met the brief and delivered the best possible final product.

    One of the most valuable parts of working with Peter was learning how he approached design with the audience in mind and considered how viewers would perceive and interact with each piece. I am grateful for the opportunity to learn from him, and I know the skills and perspective he shared with me will continue to benefit me throughout my marketing career. He’s a great person and helped me when I needed it on more than a handful of occasions.

  name: Ryan Wheaton
  role: Chief Planning Officer
  org: Pierce Transit
  quote: Peter is one of the best hires I’ve ever been a part of making. … I can’t recommend him highly enough to anyone looking for an exceptional graphic designer or art director.
  full: |
    Peter is one of the best hires I’ve ever been a part of making. His ability to take an idea, understand the underlying goals, and translate them into impactful messaging is unmatched in my experience working with marketing and design professionals.

    Peter brings a rare combination of creativity, strategic thinking, and technical talent to his work. He doesn’t just make things look great. He understands what we’re trying to accomplish and finds ways to communicate it more effectively.

    Beyond his talent, Peter is easy to work with, collaborative, and a genuinely great teammate. I can’t recommend him highly enough to anyone looking for an exceptional graphic designer or art director.
- id: melissa-smith
  order: 2
  name: Melissa Smith
  role: Co-Owner and Partner
  org: Smith-Kandal Insurance & Real Estate
  quote: We highly value Peter’s expertise, collaborative approach, and commitment to bringing our brand to life, which ultimately produced an increase in revenue for our agency.
  full: |
    Peter has been an invaluable partner in shaping and elevating our brand over the years. From developing our website branding to guiding us through a full logo rebrand, he consistently brings creativity, strategic thinking, and a clear vision to every project. His work on our video campaign further strengthened our company’s identity and presence in the community. It helped us communicate our story compellingly and engagingly. We highly value Peter’s expertise, collaborative approach, and commitment to bringing our brand to life, which ultimately produced an increase in revenue for our agency.
- id: merriah-kubista
  order: 3
  name: Merriah Kubista
  role: Marketing Intern
  org: Pierce Transit
  quote: He was generous with his knowledge and experience, and always willing to take the time to teach me new skills in marketing, design theory, and design software.
  full: |
    I had the pleasure of working with Peter during my internship at Pierce Transit, where he was a great mentor and coworker. He was generous with his knowledge and experience, and always willing to take the time to teach me new skills in marketing, design theory, and design software.

    Peter was patient and approachable, and I never felt uncomfortable asking questions or admitting when I didn’t understand something. He made it easy to learn through trial and error without making me feel defensive about my work. His feedback was consistently comprehensive, thoughtful, and constructive, giving me practical ways to improve my work while still recognizing what was working well.

    I really valued the opportunity to learn from someone with his experience, and his guidance contributed meaningfully to my growth during my internship. Peter is very knowledgeable, passionate about his work, and easy to work with, and I believe he would be a great addition to any team!
- id: michael-porter
  order: 4
  name: Michael Porter
  role: Associate Pastor
  org: Windsor Christian Church & Academy
  quote: He transformed an outdated and complicated brand and website into something clear, cohesive, and easy to navigate.
  full: |
    Peter Rebik of Rebik Design was a tremendous help to us at Windsor Christian Church and Academy. He did far more than redesign our logos and websites. He helped us clarify our message, particularly how our church and school relate to and complement one another, and communicate that relationship consistently across both websites.

    From the beginning, Peter involved our team, listened carefully, and responded to feedback quickly and graciously. He transformed an outdated and complicated brand and website into something clear, cohesive, and easy to navigate.

    I would gladly recommend Peter to anyone looking for a true partner, not just a developer.
